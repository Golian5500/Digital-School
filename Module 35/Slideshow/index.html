<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="slideWrapper">
        <div class="slide">
            <img src="img/pic1.jpg" alt="photo1" style="width: 100%;">
        </div>
        <div class="slide">
            <img src="img/pic2.jpg" alt="photo2" style="width: 100%;">
        </div>
        <div class="slide">
            <img src="img/pic3.jpg" alt="photo3" style="width: 100%;">
        </div>
    </div>

    <a class="prev"><img src="img/backward.png" alt="backward" style="width: 50px; height: 50px;" onclick="plusSlider(-1)"></a>
    <a class="next"><img src="img/forward.png" alt="forward" style="width: 50px; height: 50px;" onclick="plusSlider(1)"></a>
    <script src="js/main.js"></script>
</body>
</html>
